<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- background_color/theme_color in manifest.webmanifest must match this —
         otherwise the install splash screen and status bar flash a different
         color than the app shell for a frame. -->
    <meta name="theme-color" content="#0a0b0f" />
    <!-- iOS ignores manifest.webmanifest's display:"standalone" entirely —
         these three meta tags are the actual (non-standard) iOS mechanism.
         black-translucent extends the app under the status bar, which is
         why --safe-top (previously a dead token, see globals.css) now has
         to be consumed by every screen's top padding. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="trackz" />
    <title>trackz</title>
    <!-- Phase 15b: Google Identity Services, loaded from the CDN because GIS
         must exist as a global before sync/auth.ts initializes it. The client
         ID is NOT set here: an inline classic <script> cannot read
         import.meta.env (Vite only transforms module scripts, so the literal
         text survives into dist/index.html and `import.meta` in a classic
         script is a SyntaxError). It reaches the app through
         src/app/config.ts, which Vite does transform. -->
    <script async defer src="https://accounts.google.com/gsi/client"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
